site_name: Proyecto Sello · Big Impact
site_description: Brief Técnico Analítico — Monitoreo y anticipación de riesgos climáticos en Juliaca
site_author: Salcca Aquino, Nilver · Arce Mayta, Efrain Nayder
repo_url: https://github.com/nilver987/big_data
repo_name: nilver987/big_data

theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: custom
      accent: teal
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: custom
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  font:
    text: Inter
    code: Roboto Mono
  icon:
    logo: material/weather-partly-snowy-rainy
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.integrate
    - content.code.copy
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: "#"
      toc_depth: 3

nav:
  - Inicio: index.md
  - Datos del equipo: equipo.md
  - Dominio del proyecto: dominio.md
  - Dimensiones de análisis:
      - Tabla de asignación: dimensiones/asignacion.md
      - "❄️ Heladas": dimensiones/heladas.md
      - "🌧️ Precipitación": dimensiones/precipitacion.md
  - Alcance del proyecto: alcance.md
